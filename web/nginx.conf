server {
    listen 80;
    server_name xingtudesign.com www.xingtudesign.com;
    client_max_body_size 50m;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xingtudesign.com www.xingtudesign.com;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/xingtudesign.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xingtudesign.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = / {
        return 302 /canvas;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3003/canvas/robots.txt;
        expires 1d;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3003/canvas/sitemap.xml;
        expires 1d;
    }

    location /canvas/showcase/ {
        alias /root/infinite-canvas/web/public/showcase/;
        expires 30d;
    }

    location /showcase/ {
        alias /root/infinite-canvas/web/public/showcase/;
        expires 30d;
    }

    location /canvas/icons/ {
        alias /root/infinite-canvas/web/public/icons/;
        expires 30d;
    }

    location /icons/ {
        alias /root/infinite-canvas/web/public/icons/;
        expires 30d;
    }

    location /director-agent/ {
        proxy_pass http://127.0.0.1:4319/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache";
    }

    location /canvas/_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    location /canvas {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1200s;
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }
}
